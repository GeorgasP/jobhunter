<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="app.css">
<style>
  body{width:288px;padding:16px}
  .head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .head .mark{width:32px;height:32px;border-radius:9px;font-size:16px}
  .head b{font-size:14.5px;font-weight:650;display:block;letter-spacing:-.2px}
  .head span{font-size:11.5px;color:var(--fg-3)}
  .big{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
       padding:15px 16px;margin-bottom:11px}
  .big .n{font-size:30px;font-weight:700;letter-spacing:-1.2px;line-height:1}
  .big .l{font-size:12.5px;color:var(--fg-3);margin-top:3px}
  .row{display:flex;gap:9px;margin-bottom:9px}
  .row .big{flex:1;margin:0;padding:12px 13px}
  .row .n{font-size:21px}
  .btn{width:100%;justify-content:center;margin-bottom:8px}
  .foot{font-size:11.5px;color:var(--fg-3);text-align:center;margin-top:4px}
</style>
</head>
<body>
  <div class="head">
    <div class="mark">🎯</div>
    <div><b>JobHunter</b><span id="last">—</span></div>
  </div>

  <div class="big"><div class="n" id="m">0</div><div class="l">jobs match you right now</div></div>
  <div class="row">
    <div class="big"><div class="n" id="a">0</div><div class="l">applications</div></div>
    <div class="big"><div class="n" id="j">0</div><div class="l">jobs tracked</div></div>
  </div>

  <button class="btn primary" id="open">Open dashboard</button>
  <button class="btn" id="scan">Scan now</button>
  <div class="foot">Runs by itself twice a day</div>

  <script type="module" src="popup.js"></script>
</body>
</html>
