[project]
name = "jobhunter-backend"
version = "0.1.0"
description = "JobHunter — AI-powered automated job scout + application kit"
authors = [{name = "Panos Georgas"}]
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # Database
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # Validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",            # for Clerk JWKs

    # Background jobs
    "celery>=5.4.0",
    "redis>=5.2.0",

    # External services
    "anthropic>=0.40.0",
    "stripe>=11.4.0",
    "supabase>=2.10.0",
    "sendgrid>=6.11.0",

    # PDF parsing για CV uploads
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",

    # Job scraping (port from _job_hunter.py)
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.0",

    # Observability
    "sentry-sdk[fastapi]>=2.19.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
